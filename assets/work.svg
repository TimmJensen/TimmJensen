<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" fill="none">
<defs><linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
<stop offset=".5" stop-color="#3B82F6" stop-opacity=".18"/>
<stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
</linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.card{fill:#0f172a;stroke:rgba(59,130,246,.35);stroke-width:1}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#3B82F6}
.title{font-size:16px;font-weight:600;fill:#e6edf3}
.sub{font-size:13px;fill:#94a3b8}
.slide{animation:slide .7s cubic-bezier(.22,1,.36,1) backwards}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes slide{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(0)}18%,100%{transform:translateX(800px)}}
@media (prefers-reduced-motion:reduce){.slide,.shine{animation:none}}</style>
<g transform="translate(0 6)">
<g class="slide" style="animation-delay:0.00s">
<clipPath id="clip-0"><rect x="1" y="1" width="598" height="64" rx="12"/></clipPath>
<rect class="card" x="1" y="1" width="598" height="64" rx="12"/>
<g clip-path="url(#clip-0)">
<rect x="0" y="0" width="4" height="66" fill="#3B82F6"/>
<rect class="shine" x="-160" y="0" width="140" height="66" fill="url(#shine)" style="animation-delay:1.20s"/>
</g>
<text class="num" x="24" y="40">01</text>
<text class="title" x="70" y="29">Custom Shopify themes</text>
<text class="sub" x="70" y="49">Online Store 2.0, sections, theme blocks, metafields, metaobjects</text>
</g>
</g>
<g transform="translate(0 84)">
<g class="slide" style="animation-delay:0.15s">
<clipPath id="clip-1"><rect x="1" y="1" width="598" height="64" rx="12"/></clipPath>
<rect class="card" x="1" y="1" width="598" height="64" rx="12"/>
<g clip-path="url(#clip-1)">
<rect x="0" y="0" width="4" height="66" fill="#3B82F6"/>
<rect class="shine" x="-160" y="0" width="140" height="66" fill="url(#shine)" style="animation-delay:1.45s"/>
</g>
<text class="num" x="24" y="40">02</text>
<text class="title" x="70" y="29">Shopify Functions &amp; extensions</text>
<text class="sub" x="70" y="49">Discounts, validation, checkout and customer account UI</text>
</g>
</g>
<g transform="translate(0 162)">
<g class="slide" style="animation-delay:0.30s">
<clipPath id="clip-2"><rect x="1" y="1" width="598" height="64" rx="12"/></clipPath>
<rect class="card" x="1" y="1" width="598" height="64" rx="12"/>
<g clip-path="url(#clip-2)">
<rect x="0" y="0" width="4" height="66" fill="#3B82F6"/>
<rect class="shine" x="-160" y="0" width="140" height="66" fill="url(#shine)" style="animation-delay:1.70s"/>
</g>
<text class="num" x="24" y="40">03</text>
<text class="title" x="70" y="29">API integrations</text>
<text class="sub" x="70" y="49">Admin &amp; Storefront GraphQL: ERP, PIM, shipping, marketing</text>
</g>
</g>
<g transform="translate(0 240)">
<g class="slide" style="animation-delay:0.45s">
<clipPath id="clip-3"><rect x="1" y="1" width="598" height="64" rx="12"/></clipPath>
<rect class="card" x="1" y="1" width="598" height="64" rx="12"/>
<g clip-path="url(#clip-3)">
<rect x="0" y="0" width="4" height="66" fill="#3B82F6"/>
<rect class="shine" x="-160" y="0" width="140" height="66" fill="url(#shine)" style="animation-delay:1.95s"/>
</g>
<text class="num" x="24" y="40">04</text>
<text class="title" x="70" y="29">Performance</text>
<text class="sub" x="70" y="49">Core Web Vitals, lean Liquid and fast storefronts</text>
</g>
</g>
<g transform="translate(0 318)">
<g class="slide" style="animation-delay:0.60s">
<clipPath id="clip-4"><rect x="1" y="1" width="598" height="64" rx="12"/></clipPath>
<rect class="card" x="1" y="1" width="598" height="64" rx="12"/>
<g clip-path="url(#clip-4)">
<rect x="0" y="0" width="4" height="66" fill="#3B82F6"/>
<rect class="shine" x="-160" y="0" width="140" height="66" fill="url(#shine)" style="animation-delay:2.20s"/>
</g>
<text class="num" x="24" y="40">05</text>
<text class="title" x="70" y="29">Migrations</text>
<text class="sub" x="70" y="49">From WooCommerce, Magento and other platforms to Shopify</text>
</g>
</g>
</svg>
