<svg xmlns="http://www.w3.org/2000/svg" width="840" height="234" viewBox="0 0 840 234" fill="none">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.label{font-size:11px;font-weight:600;letter-spacing:2px;fill:#94a3b8}
.card{fill:#0f172a;stroke:rgba(59,130,246,.30);stroke-width:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.quote{font-size:16.5px;font-style:italic;fill:#f1f5f9}
.author{font-size:14px;font-weight:600;fill:#3B82F6}
.role{font-size:14px;fill:#94a3b8}</style>
<rect x="0.5" y="0.5" width="839" height="233" rx="16" fill="#0b1220" stroke="rgba(59,130,246,.22)"/>
<rect x="36" y="35" width="20" height="2" rx="1" fill="#3B82F6"/>
<text class="label" x="66" y="40">RECOMMENDATION</text>
<rect x="36" y="60" width="3" height="106" rx="1.5" fill="#3B82F6"/>
<text class="quote" x="58" y="80">“What I value most about Timm is his ability to understand a task far beyond the technical</text>
<text class="quote" x="58" y="106">implementation. He doesn’t just work from a list of requirements – he digs into the purpose,</text>
<text class="quote" x="58" y="132">the client’s needs and the solution as a whole, and often brings ideas that lift the result</text>
<text class="quote" x="58" y="158">beyond what was originally asked for.”</text>
<text x="58" y="198"><tspan class="author">— Mathias Liljeberg</tspan><tspan class="role">, Project Manager</tspan></text>
</svg>
