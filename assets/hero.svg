<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.label{font-size:11px;font-weight:600;letter-spacing:2px;fill:#94a3b8}
.card{fill:#0f172a;stroke:rgba(59,130,246,.30);stroke-width:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.name{font-size:40px;font-weight:700;fill:#f1f5f9;letter-spacing:-.5px}
.title{font-size:17px;fill:#94a3b8}
.loc{font-size:13px;font-weight:600;fill:#3B82F6}
.tag{font-size:11.5px;font-weight:600;fill:#cbd5e1}
.cta{font-size:13px;font-weight:600;fill:#ffffff}
.in{font-size:11px;font-weight:700;fill:#3B82F6}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}</style>
<rect x="0.5" y="0.5" width="839" height="229" rx="16" fill="#0b1220" stroke="rgba(59,130,246,.22)"/>
