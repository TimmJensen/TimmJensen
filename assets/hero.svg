<rect x="349" y="168" width="103" height="26" rx="13" fill="#0f172a" stroke="rgba(59,130,246,.30)"/>
<text x="400.5" y="185" text-anchor="middle" class="tag">AI workflows</text>
<circle cx="698" cy="92" r="60" stroke="#3B82F6" stroke-opacity=".35" stroke-dasharray="2 7" class="orbit"/>
